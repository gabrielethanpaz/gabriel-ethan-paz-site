<!DOCTYPE html>
<html lang="pt">
<head>

    <title>Contacto — Gabriel Ethan Paz</title>

</head>

<body>

<main>
    <div class="contact-container">

        <!-- FOTO NO TOPO -->
        <div class="contact-photo-wrapper">
            <img src="assets/img/texto4.jpg" alt="Gabriel Ethan Paz" class="contact-photo">
        </div>

        <!-- TÍTULO -->
        <h2>Contacto</h2>

        <!-- CAPA COM O NOME -->
        <div class="contact-cover">Gabriel Ethan Paz</div>

        <!-- TEXTO -->
        <p>Para contacto profissional, entrevistas, convites ou pedidos editoriais.</p>

        <!-- FORMULÁRIO -->
       <form>
    <label>Nome</label>
    <input type="text" name="nome">

    <input type="email" name="email">

    <label>Mensagem</label>
    <textarea name="mensagem"></textarea>

    <button type="submit">Enviar</button>
</form>


        <p class="section-link">

    </div>
